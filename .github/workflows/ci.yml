name: CI

# Every push and pull request runs the tests on Windows (the tool is a Windows program: registry, Explorer menu, Steam).
# Pushing a tag vX.Y.Z also builds the exe and publishes it, with its SHA-256, as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
    steps:
      # The token is not left in .git/config while "npm ci" runs the install scripts of the dependencies (gh gets it from GH_TOKEN),
      # and the exe that is shipped is built without restoring any cache.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: The tag, package.json and CHANGELOG.md agree
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package.json says $version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
      - run: npm run build
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/MapScraper.exe dist/MapScraper.exe.sha256 --title "$GITHUB_REF_NAME" --notes-file release-notes.md
